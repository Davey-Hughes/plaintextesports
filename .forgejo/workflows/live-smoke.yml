name: live-smoke

# Runs ONE #[ignore]d test against the real upstream, weekly, gating nothing.
#
# The repo has seven live smoke tests (MLB, NHL, ESPN x3, CompeteTFT x2). They are
# excluded from CI for good reason -- network flakiness must never block a merge --
# but that left nothing at all watching for an upstream reshaping its payload until
# production broke.
#
# Only `live_full_refresh` is scheduled here, deliberately. The other six are
# season-bound: they pin a year (`fetch_bracket(&client, 2025)`) or, in the ESPN
# soccer case, are documented as "run while a World Cup is on". Scheduling those
# would fail most of the year for an entirely correct reason -- no bracket exists
# in the off-season -- and a job that is red by default is worse than no job,
# because it teaches you to skip it.
#
# `live_full_refresh` is the exception: it walks the whole discover -> refresh ->
# assemble pipeline, and falls back to the Tactician's Crown id precisely because
# that overview + sheet stay published off-broadcast. Verified passing off-broadcast
# (20 tournaments discovered, 0 live events, still green). CompeteTFT is also the
# source most worth watching -- a published Google Sheet changes shape without
# announcing it, unlike the versioned league APIs.
#
# A failure here means "go look", not "the build is broken". Nothing depends on it.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

jobs:
  competetft:
    runs-on: docker
    steps:
      - uses: https://code.forgejo.org/actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --default-toolchain none
          . "$HOME/.cargo/env"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup show
      - uses: https://code.forgejo.org/actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Its own key namespace rather than sharing the ci workflow's `cargo-ssr-`
          # entry: two workflows racing to save the same key means whichever loses
          # keeps rebuilding anyway, and this one runs weekly against a target dir
          # the ci workflow would otherwise have to re-warm.
          key: cargo-live-smoke-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-live-smoke-
      # --nocapture so the printed tournament/session counts land in the log --
      # when this does fail, that output is the first thing worth reading.
      - name: CompeteTFT live pipeline
        run: cargo test --lib --features ssr live_full_refresh -- --ignored --nocapture
