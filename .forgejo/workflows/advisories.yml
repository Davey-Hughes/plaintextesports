name: advisories

# `cargo deny check advisories` against Cargo.lock: fails when a locked crate has an
# open RustSec advisory that deny.toml does not accept. Advisories only — not
# licenses, bans or sources. deny.toml gives the command to run it locally.
#
# Its own workflow rather than a job in ci.yml, deliberately: the image build there
# must never wait on it. An advisory published on a Saturday would otherwise stop
# Sunday's rebuild, the one build whose whole point is to ship fixes. It is not a
# required status check either; branch protection names ci.yml's three jobs.
#
# Two ways to accept a finding. This is the one place both are described; deny.toml
# and the README point here.
#  - one advisory, the normal path: an entry in deny.toml's `ignore` list,
#      { id = "RUSTSEC-…", reason = "…" },
#    whose reason says why it is accepted (no fixed release, not reachable, or a fix
#    that needs a major bump) and when to revisit it. It goes through a PR like any
#    other change. Every run prints each accepted advisory as a note with its reason,
#    so a green run still says what it let through. An entry that stops matching,
#    because the crate moved past it or the advisory was withdrawn, prints
#    warning[advisory-not-detected]: delete it then.
#  - everything, for a while, the emergency path: set the repository variable
#    ADVISORIES_MODE to `warn` (Settings → Actions → Variables). The job still
#    runs and prints every finding exactly as it would fail, then passes, with a
#    WARN-ONLY MODE line at the top of the step and another under any findings.
#    Delete the variable to restore the gate. Unset or any other value means
#    findings fail, and a value that is set but is not `warn` is named in the log,
#    so a typo cannot pass for a working switch.
#
# xtask/Cargo.lock is not checked: the `cargo ci` helper has no dependencies, so its
# lockfile holds only itself.

on:
  push:
    branches: [main]
  # PRs only when they touch what decides the graph or this job: the manifests,
  # Cargo.lock, deny.toml, rust-toolchain.toml (the job installs its channel), the
  # cargo config (which can change the resolved graph and the index source) or this
  # workflow. Not xtask/Cargo.lock, which is not checked. Unfiltered, an advisory
  # published today would turn every open PR red for a change none of them made.
  # Push to main, the schedule and a dispatch stay unfiltered: they are what catch a
  # new advisory against an unchanged lockfile.
  #
  # That filter is also why this is deliberately not a required status: a PR that
  # touches none of these never reports it, so a required check would leave that PR
  # pending forever.
  pull_request:
    paths:
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - "rust-toolchain.toml"
      - ".cargo/config.toml"
      - ".cargo/config"
      - ".forgejo/workflows/advisories.yml"
  workflow_dispatch:
  # Weekly, so an advisory published against an unchanged Cargo.lock still surfaces
  # when nothing merges. Clear of the Sunday 10:15 UTC image rebuild and of
  # live-smoke's Monday 06:00.
  schedule:
    - cron: "0 15 * * 1" # Mondays 15:00 UTC

# One run per event and ref. The event is in the key so a push, the schedule and a
# dispatch on main never cancel one another; a newer push to a PR still cancels that
# PR's older run.
concurrency:
  group: advisories-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-deny:
    runs-on: docker # runner default image: node + git + curl, so the checkout action works
    # Nothing is cached, so every run is a cold fetch: the fetch below measured 527 MB
    # into an empty CARGO_HOME.
    timeout-minutes: 20
    steps:
      - uses: https://code.forgejo.org/actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      # cargo-deny compiles nothing; it only needs cargo and rustc for `cargo metadata`.
      # The channel is read from rust-toolchain.toml, so the dated nightly pinned there
      # still governs this job, but it is installed with the minimal profile and none
      # of the file's components or its wasm32 target. RUSTUP_TOOLCHAIN, exported for
      # every later step, makes rustup ignore the file from then on, so it never adds
      # them. A file the sed no longer reads fails the step rather than guess.
      - name: Install Rust toolchain (rust-toolchain.toml's channel, minimal profile)
        run: |
          set -eu
          channel=$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)
          : "${channel:?no channel line in rust-toolchain.toml}"
          curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          . "$HOME/.cargo/env"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup toolchain install "$channel" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$channel" >> "$GITHUB_ENV"
      # A prebuilt release binary rather than `cargo install`, which would be a
      # multi-minute compile for a tool this job only runs. The musl build is static, so
      # it runs on whatever libc the runner image has.
      #
      # The digest is the one the release publishes beside the tarball, in
      # cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz.sha256, and it matched
      # GitHub's own digest for the asset and a local sha256sum of it. It is pinned here
      # rather than fetched at run time, because whoever can replace a release asset can
      # replace its .sha256 too. Bump the version and the digest together.
      - name: Install cargo-deny
        run: |
          set -eu
          curl -fsSL -o /tmp/cargo-deny.tar.gz \
            https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz
          echo "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f  /tmp/cargo-deny.tar.gz" | sha256sum -c -
          tar -xzf /tmp/cargo-deny.tar.gz -C "$HOME/.cargo/bin" --strip-components=1 \
            cargo-deny-0.20.2-x86_64-unknown-linux-musl/cargo-deny
          cargo deny --version
      # Everything the check needs from the network, once, in a step that fails on any
      # error whatever the mode: the advisory database (`db`, cloned from
      # github.com/RustSec/advisory-db) and the crates and index entries of the graph
      # (`index`). The check below then runs --offline — cargo-deny 0.20's replacement
      # for `check --disable-fetch` — so both of its runs are judged against this one
      # database snapshot, and a fetch that fails halfway cannot pass for a finding.
      - name: Fetch the advisory database and the crate graph
        run: |
          set -eu
          cargo deny --log-level info --locked fetch db index
          # Informational only, so it can never fail the step.
          for db in "${CARGO_HOME:-$HOME/.cargo}"/advisory-dbs/*/; do
            [ -d "$db/.git" ] && git -C "$db" log -1 --format='advisory database snapshot: %H (committed %cI)' || true
          done
      # --locked so the check reads the Cargo.lock that ships, never a fresh resolve.
      # The graph is set in deny.toml ([graph] all-features), so a local run checks the
      # same one. --log-level info prints each accepted advisory as a note with its
      # reason.
      #
      # Warn mode runs the check as usual first, so the log shows every finding at the
      # severity that fails it. Only when that fails does it run the same check again,
      # quietly and just as offline, with -W for each kind of finding (cargo-deny then
      # reports findings as warnings): if that passes, findings were all that failed,
      # and the step says so and passes. A broken deny.toml or a stale Cargo.lock has
      # already failed the fetch step, in either mode, so this step never runs on one;
      # anything else that is not a finding fails the re-run. Not -W on the only run: it
      # relabels the advisories deny.toml accepts as warnings too, and the log could no
      # longer tell them apart.
      - name: Check advisories
        env: # via env, not inline ${{ }}
          MODE: ${{ vars.ADVISORIES_MODE }}
        run: |
          set -eu
          case "$MODE" in
            warn) echo "WARN-ONLY MODE: ADVISORIES_MODE=warn, so findings below are reported but do not fail this step" ;;
            '') ;;
            *) echo "ADVISORIES_MODE is '$MODE', not 'warn', so findings fail this step as usual" ;;
          esac
          rc=0
          cargo deny --log-level info --locked --offline check --show-stats advisories || rc=$?
          if [ "$rc" -ne 0 ] && [ "$MODE" = warn ]; then
            cargo deny --log-level error --locked --offline check \
              -W vulnerability -W notice -W unmaintained -W unsound -W yanked advisories
            echo "WARN-ONLY MODE: the check above failed, and passed again with every kind of finding demoted to a warning, so findings are all that failed it. This step passes only because ADVISORIES_MODE=warn; delete the variable to restore the gate."
            rc=0
          fi
          exit "$rc"
