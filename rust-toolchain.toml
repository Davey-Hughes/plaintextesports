[toolchain]
# Pinned to a dated nightly so CI and a local checkout lint with the same clippy.
# Floating `nightly` broke CI twice in one week (2026-09-30: map_unwrap_or;
# 2026-10-05: doc_markdown firing on the prop docs Leptos's #[component] writes).
# Bump deliberately: change the date, run scripts/check-all.sh, fix what it finds.
# This is rustc 1.101.0-nightly (21b707e3f 2026-09-30).
channel = "nightly-2026-10-01"
# rustfmt + clippy so CI (and a fresh local install) always has the components the
# format/lint steps need; wasm32 is the hydrate/client build target for cargo-leptos.
components = ["rustfmt", "clippy"]
targets = ["wasm32-unknown-unknown"]
